<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    gap: 1.25rem;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    max-width: 90vw;
    max-height: 70vh;
  }
  canvas {
    display: block;
    max-width: 90vw;
    max-height: 70vh;
    border-radius: 8px;
    background: #111;
  }
  #status {
    font-weight: 300;
    color: #d8d8d8;
    font-size: 0.95rem;
    text-align: center;
  }
  #status.error { color: #ff5a1f; }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    max-width: 90vw;
  }
  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 400;
    color: #fff;
    background: transparent;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover { border-color: #888; }
  button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
  }
  #mirror.active {
    background: #fff;
    border-color: #fff;
    color: #000;
  }
</style>
</head>
<body>

<p id="status">Requesting camera access…</p>

<div id="stage">
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="controls">
  <button data-effect="normal" class="active">Normal</button>
  <button data-effect="grayscale">Grayscale</button>
  <button data-effect="invert">Invert</button>
  <button data-effect="sepia">Sepia</button>
  <button data-effect="dither">Dither</button>
  <button data-effect="edges">Edges</button>
  <button id="mirror">Mirror</button>
</div>

<script>
(function () {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusEl = document.getElementById('status');
  var controls = document.getElementById('controls');
  var mirrorBtn = document.getElementById('mirror');

  var effect = 'normal';
  var mirrored = true;

  controls.querySelectorAll('button[data-effect]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      controls.querySelectorAll('button[data-effect]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      effect = btn.dataset.effect;
    });
  });
  mirrorBtn.addEventListener('click', function () {
    mirrored = !mirrored;
    mirrorBtn.classList.toggle('active', mirrored);
  });
  mirrorBtn.classList.add('active');

  // 8x8 Bayer matrix, reused from the main page's dither look.
  var BAYER = [
     0, 32,  8, 40,  2, 34, 10, 42,
    48, 16, 56, 24, 50, 18, 58, 26,
    12, 44,  4, 36, 14, 46,  6, 38,
    60, 28, 52, 20, 62, 30, 54, 22,
     3, 35, 11, 43,  1, 33,  9, 41,
    51, 19, 59, 27, 49, 17, 57, 25,
    15, 47,  7, 39, 13, 45,  5, 37,
    63, 31, 55, 23, 61, 29, 53, 21
  ].map(function (v) { return ((v + 0.5) / 64) * 255; });

  function applyEffect(imageData) {
    var data = imageData.data;
    var w = imageData.width;

    if (effect === 'normal') return;

    if (effect === 'grayscale') {
      for (var i = 0; i < data.length; i += 4) {
        var g = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        data[i] = data[i + 1] = data[i + 2] = g;
      }
    } else if (effect === 'invert') {
      for (var i2 = 0; i2 < data.length; i2 += 4) {
        data[i2] = 255 - data[i2];
        data[i2 + 1] = 255 - data[i2 + 1];
        data[i2 + 2] = 255 - data[i2 + 2];
      }
    } else if (effect === 'sepia') {
      for (var i3 = 0; i3 < data.length; i3 += 4) {
        var r = data[i3], g2 = data[i3 + 1], b = data[i3 + 2];
        data[i3] = Math.min(255, r * 0.393 + g2 * 0.769 + b * 0.189);
        data[i3 + 1] = Math.min(255, r * 0.349 + g2 * 0.686 + b * 0.168);
        data[i3 + 2] = Math.min(255, r * 0.272 + g2 * 0.534 + b * 0.131);
      }
    } else if (effect === 'dither') {
      for (var p = 0; p < data.length; p += 4) {
        var px = (p / 4) % w;
        var py = Math.floor((p / 4) / w);
        var lum = data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114;
        var threshold = BAYER[(py & 7) * 8 + (px & 7)];
        var v = lum > threshold ? 255 : 0;
        data[p] = data[p + 1] = data[p + 2] = v;
      }
    } else if (effect === 'edges') {
      var src = new Uint8ClampedArray(data);
      var h = imageData.height;
      var gxKernel = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
      var gyKernel = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
      for (var y = 1; y < h - 1; y++) {
        for (var x = 1; x < w - 1; x++) {
          var sumX = 0, sumY = 0, k = 0;
          for (var ky = -1; ky <= 1; ky++) {
            for (var kx = -1; kx <= 1; kx++) {
              var idx = ((y + ky) * w + (x + kx)) * 4;
              var lum2 = src[idx] * 0.299 + src[idx + 1] * 0.587 + src[idx + 2] * 0.114;
              sumX += lum2 * gxKernel[k];
              sumY += lum2 * gyKernel[k];
              k++;
            }
          }
          var mag = Math.min(255, Math.sqrt(sumX * sumX + sumY * sumY));
          var di = (y * w + x) * 4;
          data[di] = data[di + 1] = data[di + 2] = mag;
        }
      }
    }
  }

  function draw() {
    ctx.save();
    if (mirrored) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (effect !== 'normal') {
      var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      applyEffect(frame);
      ctx.putImageData(frame, 0, 0);
    }

    requestAnimationFrame(draw);
  }

  navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false
  }).then(function (stream) {
    video.srcObject = stream;
    video.onloadedmetadata = function () {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      statusEl.style.display = 'none';
      requestAnimationFrame(draw);
    };
  }).catch(function (err) {
    statusEl.textContent = 'Camera access denied or unavailable (' + err.message + ').';
    statusEl.classList.add('error');
  });
})();
</script>

</body>
</html>
