<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    display: flex;
    min-height: 100%;
    box-sizing: border-box;
  }
  #sidebar {
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.25rem;
    padding: 1.5rem;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    box-sizing: border-box;
    min-width: 0;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 90vh;
  }
  #stage:fullscreen,
  #stage:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    max-height: 100vh;
    background: #000;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
    background: #111;
  }
  #stage:fullscreen canvas,
  #stage:-webkit-full-screen canvas {
    border-radius: 0;
  }
  #status {
    font-weight: 300;
    color: #d8d8d8;
    font-size: 0.95rem;
  }
  #status.error { color: #ff5a1f; }
  #controls {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
    width: 100%;
  }
  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 400;
    color: #fff;
    background: transparent;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  button:hover { border-color: #888; }
  button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
  }
  #mirror.active,
  #fullscreen.active {
    background: #fff;
    border-color: #fff;
    color: #000;
  }
  #tool-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    width: 100%;
  }
  #tool-row button { flex: 1 1 auto; }
  #zoom-row {
    width: 100%;
  }
  #dither-settings,
  #freeze-settings,
  #paint-settings,
  #shapes-settings,
  #stripe-panel {
    display: none;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    padding: 1rem 1.1rem;
    border: 1px solid #333;
    border-radius: 12px;
    box-sizing: border-box;
  }
  #dither-settings.visible,
  #freeze-settings.visible,
  #paint-settings.visible,
  #shapes-settings.visible,
  #stripe-panel { display: flex; }
  .section-title {
    font-size: 0.85rem;
    font-weight: 400;
    color: #fff;
    margin: 0;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .setting-row label {
    font-size: 0.85rem;
    font-weight: 300;
    color: #d8d8d8;
    white-space: nowrap;
  }
  .setting-row .value {
    font-size: 0.8rem;
    color: #888;
    min-width: 2ch;
    text-align: right;
  }
  .pill-group {
    display: flex;
    gap: 0.4rem;
  }
  .pill-group.wrap {
    flex-wrap: wrap;
  }
  .pill-group button {
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
  }
  .setting-row.wrap-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #ff5a1f;
    min-width: 0;
  }
  input[type="checkbox"] {
    accent-color: #ff5a1f;
    width: 16px;
    height: 16px;
  }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #sidebar { flex: none; width: 100%; }
    #main { padding-top: 0; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <p id="status">Requesting camera access…</p>

  <div id="controls">
    <button data-effect="normal" class="active">Normal</button>
    <button data-effect="dither">Dither</button>
  </div>

  <div id="tool-row">
    <button id="mirror" class="active">Mirror</button>
    <button id="freeze">Freeze</button>
    <button id="paint">Paint</button>
    <button id="shapes-toggle">3D Shapes</button>
    <button id="fullscreen">Fullscreen</button>
  </div>

  <div id="zoom-row" class="setting-row">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">
    <span class="value" id="zoom-value">1.0x</span>
  </div>

  <div id="freeze-settings">
    <div class="setting-row">
      <label for="freeze-radius">Freeze radius</label>
      <input type="range" id="freeze-radius" min="20" max="250" step="5" value="90">
      <span class="value" id="freeze-radius-value">90</span>
    </div>
    <p style="font-size: 0.78rem; font-weight: 300; color: #888; margin: 0;">
      Click the video to re-capture the frozen frame.
    </p>
  </div>

  <div id="paint-settings">
    <div class="setting-row">
      <label>Mode</label>
      <div class="pill-group" id="paint-mode-group">
        <button data-paint-mode="pixelate" class="active" type="button">Pixelate</button>
        <button data-paint-mode="blur" type="button">Blur</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="brush-size">Brush size</label>
      <input type="range" id="brush-size" min="10" max="150" step="5" value="45">
      <span class="value" id="brush-size-value">45</span>
    </div>
    <div class="setting-row" id="pixel-strength-row">
      <label for="pixel-strength">Pixel size</label>
      <input type="range" id="pixel-strength" min="3" max="40" step="1" value="12">
      <span class="value" id="pixel-strength-value">12</span>
    </div>
    <div class="setting-row" id="blur-strength-row" style="display: none;">
      <label for="blur-strength">Blur strength</label>
      <input type="range" id="blur-strength" min="2" max="30" step="1" value="8">
      <span class="value" id="blur-strength-value">8</span>
    </div>
    <div id="paint-tool-row" style="display: flex; gap: 0.5rem; width: 100%;">
      <button id="eraser" type="button" style="flex: 1;">Eraser</button>
      <button id="clear-paint" type="button" style="flex: 1;">Clear all</button>
    </div>
  </div>

  <div id="shapes-settings">
    <div class="setting-row">
      <label>Shape</label>
      <div class="pill-group" id="shape-type-group">
        <button data-shape="sphere" class="active" type="button">Sphere</button>
        <button data-shape="box" type="button">Box</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="shape-count">Count</label>
      <input type="range" id="shape-count" min="1" max="9" step="1" value="4">
      <span class="value" id="shape-count-value">4</span>
    </div>
    <div class="setting-row">
      <label for="shape-size">Size</label>
      <input type="range" id="shape-size" min="30" max="250" step="5" value="100">
      <span class="value" id="shape-size-value">100</span>
    </div>
    <div class="setting-row">
      <label for="shape-spacing">Spacing</label>
      <input type="range" id="shape-spacing" min="50" max="400" step="10" value="180">
      <span class="value" id="shape-spacing-value">180</span>
    </div>
    <div class="setting-row">
      <label for="shape-rotation-speed">Rotation</label>
      <input type="range" id="shape-rotation-speed" min="0" max="50" step="1" value="10">
      <span class="value" id="shape-rotation-speed-value">10</span>
    </div>
    <p id="shapes-status" style="font-size: 0.78rem; font-weight: 300; color: #888; margin: 0;">
      Drag the video to rotate the shapes.
    </p>
  </div>

  <div id="dither-settings">
    <div class="setting-row wrap-row">
      <label>Style</label>
      <div class="pill-group wrap" id="style-group">
        <button data-style="normal" class="active" type="button">Normal</button>
        <button data-style="grayscale" type="button">Grayscale</button>
        <button data-style="sepia" type="button">Sepia</button>
        <button data-style="invert" type="button">Invert</button>
        <button data-style="edges" type="button">Edges</button>
      </div>
    </div>
    <div class="setting-row">
      <label>Matrix</label>
      <div class="pill-group" id="matrix-group">
        <button data-matrix="2" type="button">2×2</button>
        <button data-matrix="4" type="button">4×4</button>
        <button data-matrix="8" class="active" type="button">8×8</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="block-size">Pixel size</label>
      <input type="range" id="block-size" min="1" max="10" step="1" value="1">
      <span class="value" id="block-size-value">1</span>
    </div>
    <div class="setting-row">
      <label for="brightness">Brightness</label>
      <input type="range" id="brightness" min="-50" max="50" step="1" value="0">
      <span class="value" id="brightness-value">0</span>
    </div>
    <div class="setting-row">
      <label for="color-dither">Color dither</label>
      <input type="checkbox" id="color-dither">
    </div>
  </div>

  <div id="stripe-panel">
    <p class="section-title">Stripe Capture</p>
    <div class="setting-row">
      <label>Orientation</label>
      <div class="pill-group" id="orientation-group">
        <button data-orientation="vertical" class="active" type="button">Vertical</button>
        <button data-orientation="horizontal" type="button">Horizontal</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="stripe-count">Stripes</label>
      <input type="range" id="stripe-count" min="2" max="60" step="1" value="16">
      <span class="value" id="stripe-count-value">16</span>
    </div>
    <div class="setting-row">
      <label>Trigger</label>
      <div class="pill-group" id="trigger-group">
        <button data-trigger="interval" type="button">Interval</button>
        <button data-trigger="movement" class="active" type="button">Head movement</button>
      </div>
    </div>
    <div class="setting-row" id="interval-row" style="display: none;">
      <label for="stripe-interval">Interval</label>
      <input type="range" id="stripe-interval" min="30" max="3000" step="10" value="150">
      <span class="value" id="stripe-interval-value">150ms</span>
    </div>
    <div class="setting-row" id="sensitivity-row">
      <label for="stripe-sensitivity">Sensitivity</label>
      <input type="range" id="stripe-sensitivity" min="2" max="50" step="1" value="12">
      <span class="value" id="stripe-sensitivity-value">12</span>
    </div>
    <button id="stripe-capture" type="button">Capture</button>
    <p id="stripe-progress" style="font-size: 0.78rem; font-weight: 300; color: #888; margin: 0;"></p>
  </div>
</div>

<div id="main">
  <div id="stage">
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <canvas id="three-canvas" style="display: none;"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var controls = document.getElementById('controls');
  var mirrorBtn = document.getElementById('mirror');
  var fullscreenBtn = document.getElementById('fullscreen');
  var freezeBtn = document.getElementById('freeze');
  var freezeSettings = document.getElementById('freeze-settings');
  var freezeRadiusInput = document.getElementById('freeze-radius');
  var freezeRadiusValue = document.getElementById('freeze-radius-value');
  var paintBtn = document.getElementById('paint');
  var paintSettings = document.getElementById('paint-settings');
  var paintModeGroup = document.getElementById('paint-mode-group');
  var brushSizeInput = document.getElementById('brush-size');
  var brushSizeValue = document.getElementById('brush-size-value');
  var pixelStrengthRow = document.getElementById('pixel-strength-row');
  var pixelStrengthInput = document.getElementById('pixel-strength');
  var pixelStrengthValue = document.getElementById('pixel-strength-value');
  var blurStrengthRow = document.getElementById('blur-strength-row');
  var blurStrengthInput = document.getElementById('blur-strength');
  var blurStrengthValue = document.getElementById('blur-strength-value');
  var eraserBtn = document.getElementById('eraser');
  var clearPaintBtn = document.getElementById('clear-paint');
  var threeCanvas = document.getElementById('three-canvas');
  var shapesToggleBtn = document.getElementById('shapes-toggle');
  var shapesSettings = document.getElementById('shapes-settings');
  var shapeTypeGroup = document.getElementById('shape-type-group');
  var shapeCountInput = document.getElementById('shape-count');
  var shapeCountValue = document.getElementById('shape-count-value');
  var shapeSizeInput = document.getElementById('shape-size');
  var shapeSizeValue = document.getElementById('shape-size-value');
  var shapeSpacingInput = document.getElementById('shape-spacing');
  var shapeSpacingValue = document.getElementById('shape-spacing-value');
  var shapeRotationSpeedInput = document.getElementById('shape-rotation-speed');
  var shapeRotationSpeedValue = document.getElementById('shape-rotation-speed-value');
  var shapesStatus = document.getElementById('shapes-status');
  var zoomInput = document.getElementById('zoom');
  var zoomValue = document.getElementById('zoom-value');
  var ditherSettings = document.getElementById('dither-settings');
  var styleGroup = document.getElementById('style-group');
  var matrixGroup = document.getElementById('matrix-group');
  var blockSizeInput = document.getElementById('block-size');
  var blockSizeValue = document.getElementById('block-size-value');
  var brightnessInput = document.getElementById('brightness');
  var brightnessValue = document.getElementById('brightness-value');
  var colorDitherInput = document.getElementById('color-dither');
  var orientationGroup = document.getElementById('orientation-group');
  var stripeCountInput = document.getElementById('stripe-count');
  var stripeCountValue = document.getElementById('stripe-count-value');
  var stripeIntervalInput = document.getElementById('stripe-interval');
  var stripeIntervalValue = document.getElementById('stripe-interval-value');
  var triggerGroup = document.getElementById('trigger-group');
  var intervalRow = document.getElementById('interval-row');
  var sensitivityRow = document.getElementById('sensitivity-row');
  var stripeSensitivityInput = document.getElementById('stripe-sensitivity');
  var stripeSensitivityValue = document.getElementById('stripe-sensitivity-value');
  var stripeCaptureBtn = document.getElementById('stripe-capture');
  var stripeProgress = document.getElementById('stripe-progress');

  var effect = 'normal';
  var mirrored = true;
  var dither = { matrixSize: 8, blockSize: 1, brightness: 0, color: false, style: 'normal' };
  var zoom = 1;
  var freezeActive = false;
  var freezeRadius = 90;
  var cursor = { x: 0, y: 0, active: false };
  var freezeCanvas = document.createElement('canvas');
  var freezeCtx = freezeCanvas.getContext('2d');
  var hasFreezeFrame = false;

  // Paint mask: a persistent alpha layer the user paints/erases with a soft
  // round brush. Each frame, a pixelated or blurred version of the whole
  // live frame is masked down to just the painted alpha and composited back
  // on top — so painted regions stay pixelated/blurred continuously while
  // the video keeps playing underneath, and unpainted regions are untouched.
  var paintActive = false;
  var paintMode = 'pixelate';
  var brushSize = 45;
  var pixelStrength = 12;
  var blurStrength = 8;
  var eraserActive = false;
  var hasMaskContent = false;
  var isPainting = false;
  var lastPaintPos = null;
  var maskCanvas = document.createElement('canvas');
  var maskCtx = maskCanvas.getContext('2d');
  var transformCanvas = document.createElement('canvas');
  var transformCtx = transformCanvas.getContext('2d');
  var paintedCanvas = document.createElement('canvas');
  var paintedCtx = paintedCanvas.getContext('2d');
  var smallCanvas = document.createElement('canvas');
  var smallCtx = smallCanvas.getContext('2d');

  // 3D shape mapping: the fully-composited 2D canvas (mirror/zoom/dither/
  // paint mask already baked in) is wrapped as a CanvasTexture and applied
  // to a grid of sphere/box meshes rendered with three.js, so whatever the
  // 2D pipeline currently shows becomes the "skin" on the geometry.
  var shapesActive = false;
  var shapeType = 'sphere';
  var shapeCount = 4;
  var shapeSize = 100;
  var shapeSpacing = 180;
  var shapeRotationSpeed = 10;
  var three = null; // lazily initialized: { renderer, scene, camera, texture, group, autoAngle, drag }

  function ensureThree() {
    if (three || typeof THREE === 'undefined') return three;
    var renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, 1, 1, 5000);
    var texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    var group = new THREE.Group();
    scene.add(group);
    three = {
      renderer: renderer, scene: scene, camera: camera, texture: texture, group: group,
      autoAngle: 0, drag: { active: false, x: 0, y: 0, rotX: 0, rotY: 0 }
    };
    return three;
  }

  function resizeThree() {
    if (!three) return;
    var rect = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    three.renderer.setSize(w, h, false);
    three.camera.aspect = w / h;
    three.camera.updateProjectionMatrix();
  }

  function rebuildShapes() {
    var t = ensureThree();
    if (!t) return;
    while (t.group.children.length) {
      var mesh = t.group.children.pop();
      mesh.geometry.dispose();
      mesh.material.dispose();
    }
    var geometry = shapeType === 'box'
      ? new THREE.BoxGeometry(shapeSize, shapeSize, shapeSize)
      : new THREE.SphereGeometry(shapeSize / 2, 48, 32);
    var cols = Math.ceil(Math.sqrt(shapeCount));
    var rows = Math.ceil(shapeCount / cols);
    for (var i = 0; i < shapeCount; i++) {
      var col = i % cols;
      var row = Math.floor(i / cols);
      var material = new THREE.MeshBasicMaterial({ map: t.texture });
      var mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(
        (col - (cols - 1) / 2) * shapeSpacing,
        -(row - (rows - 1) / 2) * shapeSpacing,
        0
      );
      t.group.add(mesh);
    }
    var extent = Math.max(cols, rows) * shapeSpacing + shapeSize * 2;
    t.camera.position.set(0, 0, extent * 1.15 + 200);
    t.camera.lookAt(0, 0, 0);
  }

  function renderThree(now) {
    if (!shapesActive) return;
    var t = ensureThree();
    if (!t) return;
    t.texture.needsUpdate = true;
    t.autoAngle += (shapeRotationSpeed / 1000) * 0.6;
    var ry = t.autoAngle + t.drag.rotY;
    var rx = t.drag.rotX;
    for (var i = 0; i < t.group.children.length; i++) {
      t.group.children[i].rotation.y = ry;
      t.group.children[i].rotation.x = rx;
    }
    t.renderer.render(t.scene, t.camera);
  }

  // A small offscreen 2D canvas used to snapshot the WebGL shapes canvas
  // (which doesn't support getImageData directly) when it's the current
  // "live feed", so freeze/stripe capture can read pixels from it the same
  // way they already do for the flat 2D canvas.
  var captureBuffer = document.createElement('canvas');
  var captureBufferCtx = captureBuffer.getContext('2d', { willReadFrequently: true });

  var sequence = {
    active: false,
    cycle: 1,
    tick: 0,
    trigger: 'movement',
    orientation: 'vertical',
    count: 16,
    interval: 150,
    sensitivity: 0.12,
    stripes: [],
    timer: null
  };

  // Lightweight "head tracking": rather than a full face-detection model,
  // this downsamples the raw video to a tiny grayscale grid, diffs it
  // against the previous frame, and takes the diff-weighted centroid as
  // the tracked head position. It's cheap enough to run every frame and
  // good enough to react to someone actually moving in frame.
  var TRACK_W = 80, TRACK_H = 60;
  var trackCanvas = document.createElement('canvas');
  trackCanvas.width = TRACK_W;
  trackCanvas.height = TRACK_H;
  var trackCtx = trackCanvas.getContext('2d', { willReadFrequently: true });
  var prevGray = null;
  var lastCapturePos = null;
  var lastMotionCaptureAt = 0;
  var MOTION_COOLDOWN_MS = 120;
  var MOTION_PIXEL_THRESHOLD = 20;
  var MOTION_MIN_ENERGY = TRACK_W * TRACK_H * 0.35;

  controls.querySelectorAll('button[data-effect]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      controls.querySelectorAll('button[data-effect]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      effect = btn.dataset.effect;
      ditherSettings.classList.toggle('visible', effect === 'dither');
    });
  });
  mirrorBtn.addEventListener('click', function () {
    mirrored = !mirrored;
    mirrorBtn.classList.toggle('active', mirrored);
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  fullscreenBtn.addEventListener('click', function () {
    if (!isFullscreen()) {
      if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function () {
    fullscreenBtn.classList.toggle('active', isFullscreen());
  });
  document.addEventListener('webkitfullscreenchange', function () {
    fullscreenBtn.classList.toggle('active', isFullscreen());
  });

  zoomInput.addEventListener('input', function () {
    zoom = parseFloat(zoomInput.value);
    zoomValue.textContent = zoom.toFixed(1) + 'x';
  });

  function captureFreeze() {
    freezeCanvas.width = canvas.width;
    freezeCanvas.height = canvas.height;
    var source = (shapesActive && three) ? threeCanvas : canvas;
    freezeCtx.drawImage(source, 0, 0, freezeCanvas.width, freezeCanvas.height);
    hasFreezeFrame = true;
  }
  freezeBtn.addEventListener('click', function () {
    freezeActive = !freezeActive;
    freezeBtn.classList.toggle('active', freezeActive);
    freezeSettings.classList.toggle('visible', freezeActive);
    if (freezeActive) captureFreeze();
  });
  freezeRadiusInput.addEventListener('input', function () {
    freezeRadius = parseInt(freezeRadiusInput.value, 10);
    freezeRadiusValue.textContent = freezeRadiusInput.value;
  });

  paintBtn.addEventListener('click', function () {
    paintActive = !paintActive;
    paintBtn.classList.toggle('active', paintActive);
    paintSettings.classList.toggle('visible', paintActive);
    if (!paintActive) { isPainting = false; lastPaintPos = null; }
  });
  paintModeGroup.querySelectorAll('button[data-paint-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      paintModeGroup.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');

  // Soft round brush: a radial gradient stamp so painted edges feather
  // rather than cutting off hard. Eraser uses destination-out to punch
  // holes in the same mask instead of painting a second one.
  function paintStamp(x, y) {

    grad.addColorStop(0.7, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');

      var steps = Math.ceil(dist / step);
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;

  // Applies the pixelate/blur transform to the whole current frame, masks
  // it down to the painted alpha, and composites the result back on top —
  // so only painted regions show the effect, and it stays live every frame.
  function applyPaintMask() {
    transformCtx.clearRect(0, 0, transformCanvas.width, transformCanvas.height);
    if (paintMode === 'pixelate') {
      var block = Math.max(1, pixelStrength);
      var sw = Math.max(1, Math.round(canvas.width / block));
      var sh = Math.max(1, Math.round(canvas.height / block));
      smallCanvas.width = sw;
      smallCanvas.height = sh;
      smallCtx.imageSmoothingEnabled = true;
      smallCtx.drawImage(canvas, 0, 0, sw, sh);
      transformCtx.imageSmoothingEnabled = false;
      transformCtx.drawImage(smallCanvas, 0, 0, sw, sh, 0, 0, transformCanvas.width, transformCanvas.height);
    } else {
      transformCtx.filter = 'blur(' + blurStrength + 'px)';
      transformCtx.drawImage(canvas, 0, 0);
      transformCtx.filter = 'none';
    }

    paintedCtx.clearRect(0, 0, paintedCanvas.width, paintedCanvas.height);
    paintedCtx.globalCompositeOperation = 'source-over';
    paintedCtx.drawImage(transformCanvas, 0, 0);
    paintedCtx.globalCompositeOperation = 'destination-in';
    paintedCtx.drawImage(maskCanvas, 0, 0);
    paintedCtx.globalCompositeOperation = 'source-over';

    ctx.drawImage(paintedCanvas, 0, 0);
  }

  // Accounts for object-fit: contain letterboxing so the cursor position
  // maps correctly onto the canvas's internal pixel resolution.
  function updateCursorFromEvent(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var canvasAspect = canvas.width / canvas.height;
    var rectAspect = rect.width / rect.height;
    var drawWidth, drawHeight, offsetX, offsetY;
    if (rectAspect > canvasAspect) {
      drawHeight = rect.height;
      drawWidth = drawHeight * canvasAspect;
      offsetX = (rect.width - drawWidth) / 2;
      offsetY = 0;
    } else {
      drawWidth = rect.width;
      drawHeight = drawWidth / canvasAspect;
      offsetX = 0;
      offsetY = (rect.height - drawHeight) / 2;
    }
    var relX = clientX - rect.left - offsetX;
    var relY = clientY - rect.top - offsetY;
    cursor.x = (relX / drawWidth) * canvas.width;
    cursor.y = (relY / drawHeight) * canvas.height;
    cursor.active = relX >= 0 && relX <= drawWidth && relY >= 0 && relY <= drawHeight;
  }

  orientationGroup.querySelectorAll('button[data-orientation]').forEach(function (btn) {

  triggerGroup.querySelectorAll('button[data-trigger]').forEach(function (btn) {
    btn.addEventListener('click', function () {

      btn.classList.add('active');
      sequence.trigger = btn.dataset.trigger;

      sensitivityRow.style.display = sequence.trigger === 'movement' ? '' : 'none';

      // chain (re)started; movement mode just needs a fresh baseline so
      // it doesn't immediately fire from stale motion history.
      if (sequence.active) {

  intervalRow.style.display = sequence.trigger === 'interval' ? '' : 'none';

  // Splits a captured full-frame ImageData into the rect for one stripe.
  function extractRegion(full, rect) {
    var out = ctx.createImageData(rect.w, rect.h);
    var src = full.data, dst = out.data;
    var rowBytes = rect.w * 4;
    for (var row = 0; row < rect.h; row++) {
      var srcStart = ((rect.y + row) * full.width + rect.x) * 4;
      dst.set(src.subarray(srcStart, srcStart + rowBytes), row * rowBytes);
    }
    return out;
  }

  function stripeRect(index, count, orientation) {
    if (orientation === 'horizontal') {
      var y0 = Math.floor((index * canvas.height) / count);
      var y1 = Math.floor(((index + 1) * canvas.height) / count);
      return { x: 0, y: y0, w: canvas.width, h: y1 - y0 };
    }
    var x0 = Math.floor((index * canvas.width) / count);
    var x1 = Math.floor(((index + 1) * canvas.width) / count);
    return { x: x0, y: 0, w: x1 - x0, h: canvas.height };
  }

  function captureStripe(index) {
    var w = canvas.width, h = canvas.height;
    var pixelSource = ctx;
    if (shapesActive && three) {
      captureBuffer.width = w;
      captureBuffer.height = h;
      captureBufferCtx.drawImage(threeCanvas, 0, 0, w, h);
      pixelSource = captureBufferCtx;
    }
    var full = pixelSource.getImageData(0, 0, w, h);
    var rect = stripeRect(index, sequence.count, sequence.orientation);
    sequence.stripes[index] = { rect: rect, data: extractRegion(full, rect) };
  }

  // `sequence.tick` counts every capture ever made in this run; the stripe
  // it writes to is `tick % sequence.count`, read fresh every call — so
  // changing the stripe count or orientation live retargets the very next
  // capture instead of requiring a restart. It never stops on its own:
  // once the composite is fully filled, it keeps rolling forward
  // indefinitely, replacing one stripe in place per capture with no
  // reset/flash, until Stop is clicked.
  function captureOneStripe() {
    var slot = sequence.tick % sequence.count;
    captureStripe(slot);
    sequence.cycle = Math.floor(sequence.tick / sequence.count) + 1;
    sequence.tick++;
    return slot;
  }

  function runIntervalCapture() {
    var slot = captureOneStripe();
    stripeProgress.textContent = 'Rolling — stripe ' + (slot + 1) + ' of ' + sequence.count +
      ' refreshed (pass ' + sequence.cycle + ').';
    sequence.timer = setTimeout(runIntervalCapture, sequence.interval);
  }

  function triggerMovementCapture() {
    var slot = captureOneStripe();
    stripeProgress.textContent = 'Head moved — stripe ' + (slot + 1) + ' of ' + sequence.count +
      ' captured (pass ' + sequence.cycle + ').';
  }

  function cancelSequence() {
    if (sequence.timer) clearTimeout(sequence.timer);
    sequence.timer = null;
    sequence.active = false;
    sequence.stripes = [];
    lastCapturePos = null;
    stripeCaptureBtn.textContent = 'Capture';
    stripeProgress.textContent = 'Stopped.';
  }

  stripeCaptureBtn.addEventListener('click', function () {
    if (sequence.active) {
      cancelSequence();
      return;
    }
    sequence.count = parseInt(stripeCountInput.value, 10);
    sequence.interval = parseInt(stripeIntervalInput.value, 10);
    sequence.cycle = 1;
    sequence.tick = 0;
    sequence.stripes = new Array(sequence.count).fill(null);
    sequence.active = true;
    lastCapturePos = null;
    stripeCaptureBtn.textContent = 'Stop';

    // chosen trigger: a timer chain, or motion events from updateHeadTracking.
    if (sequence.trigger === 'interval') {
      runIntervalCapture();
    } else {
      triggerMovementCapture();
    }
  });

  // Draws the raw video into a tiny offscreen canvas, diffs it against the
  // previous frame, and — when there's enough motion to trust a position —
  // fires a movement-triggered capture once the tracked point has moved
  // past the sensitivity threshold since the last capture.
  function updateHeadTracking(now) {
    if (!video.videoWidth) return;
    trackCtx.drawImage(video, 0, 0, TRACK_W, TRACK_H);
    var data = trackCtx.getImageData(0, 0, TRACK_W, TRACK_H).data;
    var gray = new Float32Array(TRACK_W * TRACK_H);
    for (var i = 0, p = 0; i < data.length; i += 4, p++) {
      gray[p] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
    }
    if (prevGray) {
      var sumX = 0, sumY = 0, sumW = 0;
      for (var y = 0; y < TRACK_H; y++) {
        for (var x = 0; x < TRACK_W; x++) {
          var idx = y * TRACK_W + x;
          var diff = Math.abs(gray[idx] - prevGray[idx]);
          if (diff > MOTION_PIXEL_THRESHOLD) {
            sumX += x * diff; sumY += y * diff; sumW += diff;
          }
        }
      }
      if (sumW > MOTION_MIN_ENERGY) {
        var headPos = { x: sumX / sumW, y: sumY / sumW };
        if (sequence.active && sequence.trigger === 'movement') {
          if (!lastCapturePos) {
            lastCapturePos = headPos;
          } else {
            var dx = headPos.x - lastCapturePos.x;
            var dy = headPos.y - lastCapturePos.y;
            var distNorm = Math.sqrt(dx * dx + dy * dy) / Math.max(TRACK_W, TRACK_H);
            if (distNorm > sequence.sensitivity && (now - lastMotionCaptureAt) > MOTION_COOLDOWN_MS) {
              lastMotionCaptureAt = now;
              lastCapturePos = headPos;
              triggerMovementCapture();
            }
          }
        }
      }
    }
    prevGray = gray;
  }

  // Bayer matrices at a few sizes — bigger matrices give smoother, more
  // precise gradients; smaller ones a coarser, more graphic dot pattern.
  function buildBayer(raw, n) {
    return raw.map(function (v) { return ((v + 0.5) / (n * n)) * 255; });
  }
  var BAYER_MATRICES = {
    2: buildBayer([0, 2, 3, 1], 2),
    4: buildBayer([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], 4),
    8: buildBayer([
       0, 32,  8, 40,  2, 34, 10, 42,
      48, 16, 56, 24, 50, 18, 58, 26,
      12, 44,  4, 36, 14, 46,  6, 38,
      60, 28, 52, 20, 62, 30, 54, 22,
       3, 35, 11, 43,  1, 33,  9, 41,
      51, 19, 59, 27, 49, 17, 57, 25,
      15, 47,  7, 39, 13, 45,  5, 37,
      63, 31, 55, 23, 61, 29, 53, 21
    ], 8)
  };

  // Style pre-processors — each mutates `data` in place. These used to be
  // standalone effects; now they're applied as a base look before dithering.
  function styleGrayscale(imageData) {
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var g = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      data[i] = data[i + 1] = data[i + 2] = g;

  function styleInvert(imageData) {
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      data[i] = 255 - data[i];
      data[i + 1] = 255 - data[i + 1];
      data[i + 2] = 255 - data[i + 2];
    }
  }
  function styleSepia(imageData) {
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var r = data[i], g = data[i + 1], b = data[i + 2];
      data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
      data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
      data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
    }
  }
  function styleEdges(imageData) {
    var data = imageData.data;
    var w = imageData.width, h = imageData.height;
    var src = new Uint8ClampedArray(data);
    var gxKernel = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
    var gyKernel = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var sumX = 0, sumY = 0, k = 0;
        for (var ky = -1; ky <= 1; ky++) {
          for (var kx = -1; kx <= 1; kx++) {
            var idx = ((y + ky) * w + (x + kx)) * 4;
            var lum = src[idx] * 0.299 + src[idx + 1] * 0.587 + src[idx + 2] * 0.114;
            sumX += lum * gxKernel[k];
            sumY += lum * gyKernel[k];
            k++;
          }
        }
        var mag = Math.min(255, Math.sqrt(sumX * sumX + sumY * sumY));
        var di = (y * w + x) * 4;
        data[di] = data[di + 1] = data[di + 2] = mag;
      }
    }
  }
  var DITHER_STYLES = {
    grayscale: styleGrayscale,
    sepia: styleSepia,
    invert: styleInvert,
    edges: styleEdges
  };

  function applyEffect(imageData) {
    var data = imageData.data;
    var w = imageData.width;

    if (effect === 'normal') return;

    if (effect === 'dither') {
      var styleFn = DITHER_STYLES[dither.style];
      if (styleFn) styleFn(imageData);

      var h0 = imageData.height;
      var matrix = BAYER_MATRICES[dither.matrixSize];
      var msize = dither.matrixSize;
      var block = Math.max(1, dither.blockSize);
      var bias = dither.brightness * 2.55;

      for (var by = 0; by < h0; by += block) {
        var byEnd = Math.min(by + block, h0);
        for (var bx = 0; bx < w; bx += block) {
          var bxEnd = Math.min(bx + block, w);
          var rSum = 0, gSum = 0, bSum = 0, count = 0;
          for (var yy = by; yy < byEnd; yy++) {
            for (var xx = bx; xx < bxEnd; xx++) {
              var si = (yy * w + xx) * 4;
              rSum += data[si]; gSum += data[si + 1]; bSum += data[si + 2];
              count++;
            }
          }
          var rAvg = rSum / count + bias;
          var gAvg = gSum / count + bias;
          var bAvg = bSum / count + bias;
          var mi = ((by / block | 0) % msize) * msize + ((bx / block | 0) % msize);
          var threshold = matrix[mi];

          var rOut, gOut, bOut;
          if (dither.color) {
            rOut = rAvg > threshold ? 255 : 0;
            gOut = gAvg > threshold ? 255 : 0;
            bOut = bAvg > threshold ? 255 : 0;
          } else {
            var lumAvg = rAvg * 0.299 + gAvg * 0.587 + bAvg * 0.114;
            var v = lumAvg > threshold ? 255 : 0;
            rOut = gOut = bOut = v;
          }

          for (var yy2 = by; yy2 < byEnd; yy2++) {
            for (var xx2 = bx; xx2 < bxEnd; xx2++) {
              var di2 = (yy2 * w + xx2) * 4;
              data[di2] = rOut; data[di2 + 1] = gOut; data[di2 + 2] = bOut;
            }
          }
        }
      }
    }
  }

  function draw(now) {
    updateHeadTracking(now);

    var vw = video.videoWidth || canvas.width;
    var vh = video.videoHeight || canvas.height;
    var sw = vw / zoom;
    var sh = vh / zoom;
    var sx = (vw - sw) / 2;
    var sy = (vh - sh) / 2;

    ctx.save();
    if (mirrored) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (effect !== 'normal') {
      var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      applyEffect(frame);
      ctx.putImageData(frame, 0, 0);
    }

    if (hasMaskContent) applyPaintMask();
    if (paintActive && cursor.active) {
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, brushSize / 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (freezeActive && hasFreezeFrame && cursor.active) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, freezeRadius, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(freezeCanvas, 0, 0);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, freezeRadius, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff5a1f';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Locked stripes from a capture sequence paint over the live frame,
    // so already-captured stripes stay frozen while the rest keeps playing.
    for (var s = 0; s < sequence.stripes.length; s++) {
      var stripe = sequence.stripes[s];
      if (stripe) ctx.putImageData(stripe.data, stripe.rect.x, stripe.rect.y);
    }

    // Renders last, so the 3D shapes' shared texture picks up everything
    // the 2D pipeline just drew this frame (effect, paint mask, freeze,
    // stripes and all).
    renderThree(now);

    requestAnimationFrame(draw);
  }

  navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false
  }).then(function (stream) {
    video.srcObject = stream;
    video.onloadedmetadata = function () {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      maskCanvas.width = canvas.width;
      maskCanvas.height = canvas.height;
      transformCanvas.width = canvas.width;
      transformCanvas.height = canvas.height;
      paintedCanvas.width = canvas.width;
      paintedCanvas.height = canvas.height;
      statusEl.style.display = 'none';
      requestAnimationFrame(draw);
    };
  }).catch(function (err) {
    statusEl.textContent = 'Camera access denied or unavailable (' + err.message + ').';
    statusEl.classList.add('error');
  });
})();
</script>

</body>
</html>
