<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .veil {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.9) 100%);
    z-index: 1;
  }
  main {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .hello {
    font-weight: 300;
    letter-spacing: 0.05em;
    font-size: 1.4rem;
    color: #d8d8d8;
    margin: 0 0 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .hello::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5a1f;
    display: inline-block;
  }
  h1 {
    font-weight: 600;
    letter-spacing: -0.02em;
    font-size: clamp(3rem, 12vw, 9rem);
    margin: 0;
    line-height: 1;
  }
</style>
</head>
<body>

<video class="bg-video" autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="veil"></div>

<main>
  <p class="hello">Hello, my name is</p>
  <h1>Melanie Daveid</h1>
</main>

</body>
</html>
