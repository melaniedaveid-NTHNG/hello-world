<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    gap: 1.25rem;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    max-width: 90vw;
    max-height: 70vh;
  }
  canvas {
    display: block;
    max-width: 90vw;
    max-height: 70vh;
    border-radius: 8px;
    background: #111;
  }
  #status {
    font-weight: 300;
    color: #d8d8d8;
    font-size: 0.95rem;
    text-align: center;
  }
  #status.error { color: #ff5a1f; }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    max-width: 90vw;
  }
  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 400;
    color: #fff;
    background: transparent;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover { border-color: #888; }
  button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
  }
  #mirror.active {
    background: #fff;
    border-color: #fff;
    color: #000;
  }
  #dither-settings {
    display: none;
    flex-direction: column;
    gap: 0.75rem;
    width: min(420px, 90vw);
    padding: 1rem 1.25rem;
    border: 1px solid #333;
    border-radius: 12px;
  }
  #dither-settings.visible { display: flex; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .setting-row label {
    font-size: 0.85rem;
    font-weight: 300;
    color: #d8d8d8;
    white-space: nowrap;
  }
  .setting-row .value {
    font-size: 0.8rem;
    color: #888;
    min-width: 2ch;
    text-align: right;
  }
  .pill-group {
    display: flex;
    gap: 0.4rem;
  }
  .pill-group button {
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #ff5a1f;
  }
  input[type="checkbox"] {
    accent-color: #ff5a1f;
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

<p id="status">Requesting camera access…</p>

<div id="stage">
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="controls">
  <button data-effect="normal" class="active">Normal</button>
  <button data-effect="grayscale">Grayscale</button>
  <button data-effect="invert">Invert</button>
  <button data-effect="sepia">Sepia</button>
  <button data-effect="dither">Dither</button>
  <button data-effect="edges">Edges</button>
  <button id="mirror">Mirror</button>
</div>

<div id="dither-settings">
  <div class="setting-row">
    <label>Matrix</label>
    <div class="pill-group" id="matrix-group">
      <button data-matrix="2" type="button">2×2</button>
      <button data-matrix="4" type="button">4×4</button>
      <button data-matrix="8" class="active" type="button">8×8</button>
    </div>
  </div>
  <div class="setting-row">
    <label for="block-size">Pixel size</label>
    <input type="range" id="block-size" min="1" max="10" step="1" value="1">
    <span class="value" id="block-size-value">1</span>
  </div>
  <div class="setting-row">
    <label for="brightness">Brightness</label>
    <input type="range" id="brightness" min="-50" max="50" step="1" value="0">
    <span class="value" id="brightness-value">0</span>
  </div>
  <div class="setting-row">
    <label for="color-dither">Color dither</label>
    <input type="checkbox" id="color-dither">
  </div>
</div>

<script>
(function () {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusEl = document.getElementById('status');
  var controls = document.getElementById('controls');
  var mirrorBtn = document.getElementById('mirror');
  var ditherSettings = document.getElementById('dither-settings');
  var matrixGroup = document.getElementById('matrix-group');
  var blockSizeInput = document.getElementById('block-size');
  var blockSizeValue = document.getElementById('block-size-value');
  var brightnessInput = document.getElementById('brightness');
  var brightnessValue = document.getElementById('brightness-value');
  var colorDitherInput = document.getElementById('color-dither');

  var effect = 'normal';
  var mirrored = true;
  var dither = { matrixSize: 8, blockSize: 1, brightness: 0, color: false };

  controls.querySelectorAll('button[data-effect]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      controls.querySelectorAll('button[data-effect]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      effect = btn.dataset.effect;
      ditherSettings.classList.toggle('visible', effect === 'dither');
    });
  });
  mirrorBtn.addEventListener('click', function () {
    mirrored = !mirrored;
    mirrorBtn.classList.toggle('active', mirrored);
  });
  mirrorBtn.classList.add('active');

  matrixGroup.querySelectorAll('button[data-matrix]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      matrixGroup.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      dither.matrixSize = parseInt(btn.dataset.matrix, 10);
    });
  });
  blockSizeInput.addEventListener('input', function () {
    dither.blockSize = parseInt(blockSizeInput.value, 10);
    blockSizeValue.textContent = blockSizeInput.value;
  });
  brightnessInput.addEventListener('input', function () {
    dither.brightness = parseInt(brightnessInput.value, 10);
    brightnessValue.textContent = brightnessInput.value;
  });
  colorDitherInput.addEventListener('change', function () {
    dither.color = colorDitherInput.checked;
  });

  // Bayer matrices at a few sizes — bigger matrices give smoother, more
  // precise gradients; smaller ones a coarser, more graphic dot pattern.
  function buildBayer(raw, n) {
    return raw.map(function (v) { return ((v + 0.5) / (n * n)) * 255; });
  }
  var BAYER_MATRICES = {
    2: buildBayer([0, 2, 3, 1], 2),
    4: buildBayer([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], 4),
    8: buildBayer([
       0, 32,  8, 40,  2, 34, 10, 42,
      48, 16, 56, 24, 50, 18, 58, 26,
      12, 44,  4, 36, 14, 46,  6, 38,
      60, 28, 52, 20, 62, 30, 54, 22,
       3, 35, 11, 43,  1, 33,  9, 41,
      51, 19, 59, 27, 49, 17, 57, 25,
      15, 47,  7, 39, 13, 45,  5, 37,
      63, 31, 55, 23, 61, 29, 53, 21
    ], 8)
  };

  function applyEffect(imageData) {
    var data = imageData.data;
    var w = imageData.width;

    if (effect === 'normal') return;

    if (effect === 'grayscale') {
      for (var i = 0; i < data.length; i += 4) {
        var g = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        data[i] = data[i + 1] = data[i + 2] = g;
      }
    } else if (effect === 'invert') {
      for (var i2 = 0; i2 < data.length; i2 += 4) {
        data[i2] = 255 - data[i2];
        data[i2 + 1] = 255 - data[i2 + 1];
        data[i2 + 2] = 255 - data[i2 + 2];
      }
    } else if (effect === 'sepia') {
      for (var i3 = 0; i3 < data.length; i3 += 4) {
        var r = data[i3], g2 = data[i3 + 1], b = data[i3 + 2];
        data[i3] = Math.min(255, r * 0.393 + g2 * 0.769 + b * 0.189);
        data[i3 + 1] = Math.min(255, r * 0.349 + g2 * 0.686 + b * 0.168);
        data[i3 + 2] = Math.min(255, r * 0.272 + g2 * 0.534 + b * 0.131);
      }
    } else if (effect === 'dither') {
      var h0 = imageData.height;
      var matrix = BAYER_MATRICES[dither.matrixSize];
      var msize = dither.matrixSize;
      var block = Math.max(1, dither.blockSize);
      var bias = dither.brightness * 2.55;

      for (var by = 0; by < h0; by += block) {
        var byEnd = Math.min(by + block, h0);
        for (var bx = 0; bx < w; bx += block) {
          var bxEnd = Math.min(bx + block, w);
          var rSum = 0, gSum = 0, bSum = 0, count = 0;
          for (var yy = by; yy < byEnd; yy++) {
            for (var xx = bx; xx < bxEnd; xx++) {
              var si = (yy * w + xx) * 4;
              rSum += data[si]; gSum += data[si + 1]; bSum += data[si + 2];
              count++;
            }
          }
          var rAvg = rSum / count + bias;
          var gAvg = gSum / count + bias;
          var bAvg = bSum / count + bias;
          var mi = ((by / block | 0) % msize) * msize + ((bx / block | 0) % msize);
          var threshold = matrix[mi];

          var rOut, gOut, bOut;
          if (dither.color) {
            rOut = rAvg > threshold ? 255 : 0;
            gOut = gAvg > threshold ? 255 : 0;
            bOut = bAvg > threshold ? 255 : 0;
          } else {
            var lumAvg = rAvg * 0.299 + gAvg * 0.587 + bAvg * 0.114;
            var v = lumAvg > threshold ? 255 : 0;
            rOut = gOut = bOut = v;
          }

          for (var yy2 = by; yy2 < byEnd; yy2++) {
            for (var xx2 = bx; xx2 < bxEnd; xx2++) {
              var di2 = (yy2 * w + xx2) * 4;
              data[di2] = rOut; data[di2 + 1] = gOut; data[di2 + 2] = bOut;
            }
          }
        }
      }
    } else if (effect === 'edges') {
      var src = new Uint8ClampedArray(data);
      var h = imageData.height;
      var gxKernel = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
      var gyKernel = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
      for (var y = 1; y < h - 1; y++) {
        for (var x = 1; x < w - 1; x++) {
          var sumX = 0, sumY = 0, k = 0;
          for (var ky = -1; ky <= 1; ky++) {
            for (var kx = -1; kx <= 1; kx++) {
              var idx = ((y + ky) * w + (x + kx)) * 4;
              var lum2 = src[idx] * 0.299 + src[idx + 1] * 0.587 + src[idx + 2] * 0.114;
              sumX += lum2 * gxKernel[k];
              sumY += lum2 * gyKernel[k];
              k++;
            }
          }
          var mag = Math.min(255, Math.sqrt(sumX * sumX + sumY * sumY));
          var di = (y * w + x) * 4;
          data[di] = data[di + 1] = data[di + 2] = mag;
        }
      }
    }
  }

  function draw() {
    ctx.save();
    if (mirrored) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (effect !== 'normal') {
      var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      applyEffect(frame);
      ctx.putImageData(frame, 0, 0);
    }

    requestAnimationFrame(draw);
  }

  navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
    audio: false
  }).then(function (stream) {
    video.srcObject = stream;
    video.onloadedmetadata = function () {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      statusEl.style.display = 'none';
      requestAnimationFrame(draw);
    };
  }).catch(function (err) {
    statusEl.textContent = 'Camera access denied or unavailable (' + err.message + ').';
    statusEl.classList.add('error');
  });
})();
</script>

</body>
</html>
